<div class="auth-page">
  <div class="auth-card">

    <section class="auth-form-side">
      <div class="brand">
        <div class="brand-icon">C</div>
        <span>Connectly</span>
      </div>

      <div class="auth-header">
        <span class="welcome-badge">Welcome back 👋</span>
        <h1>Login to your account</h1>
        <p>Share moments, follow friends, and build your network.</p>
      </div>

<form class="auth-form" (ngSubmit)="login()">
  <div class="form-group">
    <label>Email address</label>
    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Enter your email"
    />
  </div>

  <div class="form-group">
    <label>Password</label>
    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Enter your password"
    />
  </div>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <button
    type="submit"
    class="auth-btn"
    [disabled]="isLoading">
    {{ isLoading ? 'Logging in...' : 'Login' }}
  </button>
</form>

      <p class="auth-switch">
        Don't have an account?
        <a routerLink="/register">Create account</a>
      </p>
    </section>

    <section class="auth-visual-side">
      <div class="circle circle-one"></div>
      <div class="circle circle-two"></div>
      <div class="circle circle-three"></div>

      <div class="visual-content">
        <span>Social platform</span>
        <h2>Connect.<br>Create. Grow.</h2>
        <p>Discover people, share posts, and stay connected every day.</p>
      </div>
    </section>

  </div>
</div>
